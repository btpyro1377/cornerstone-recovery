<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cornerstone Recovery Foundation — We've Moved</title>
  <meta http-equiv="refresh" content="3; url=https://cornerstonerecoveryfoundation.org/">
  <link rel="canonical" href="https://cornerstonerecoveryfoundation.org/">
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin:0; padding:0; font-family:'Inter',sans-serif; background:#f8f9fa; color:#333; }
    .container { max-width:600px; margin:10vh auto; text-align:center; padding:40px 24px; background:#fff; border-radius:12px; box-shadow:0 2px 20px rgba(0,0,0,0.08); }
    h1 { color:#1a3a5c; font-size:2em; margin:0 0 16px; }
    p { font-size:1.1em; color:#555; line-height:1.6; margin:16px 0; }
    a.btn { display:inline-block; background:#1a3a5c; color:#fff; padding:14px 36px; font-size:1.05em; text-decoration:none; border-radius:6px; margin-top:12px; font-weight:600; }
    a.btn:hover { background:#245080; }
    .small { color:#999; font-size:0.9em; margin-top:32px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>We've Moved!</h1>
    <p>Cornerstone Recovery Foundation has a new home. Please visit us at our new site:</p>
    <a class="btn" href="https://cornerstonerecoveryfoundation.org/">Go to New Site</a>
    <p class="small">Redirecting automatically in 3 seconds...</p>
  </div>
  <script>setTimeout(function(){window.location.replace("https://cornerstonerecoveryfoundation.org/");}, 3000);</script>
</body>
</html>
